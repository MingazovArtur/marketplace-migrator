version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  # Синхронизация кода для горячей перезагрузки
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app  # Синхронизация кода для горячей перезагрузки
      - /app/node_modules # Исключаем node_modules из синхронизации (чтобы не ломалось)
    depends_on:
      - backend