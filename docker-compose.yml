services:
  db:
    image: postgres:15-alpine
    stop_grace_period: 60s
    container_name: marketplace_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-migrator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-migrator_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_migrator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-migrator_user} -d ${POSTGRES_DB:-marketplace_migrator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      # Зеркало PyPI для сетей с обрывом TLS до pypi.org (Round 28);
      # по умолчанию — официальный индекс
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: marketplace_backend:latest
    container_name: marketplace_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_worker:
    image: marketplace_backend:latest
    pull_policy: never
    container_name: marketplace_celery
    command: celery -A celery_app worker --loglevel=info --pool=solo -Q default
    volumes:
      - ./backend:/app
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Отдельный воркер для долгих загрузок спеков (Ozon — 30+ минут):
  # раньше они стояли в общей очереди pool=solo и миграции «зависали на 0%».
  # SPECS_WORKER=1 — на старте этого контейнера реестр мониторинга помечает
  # записи убитых перезапуском задач как «прервана» (можно продолжить).
  celery_specs_worker:
    image: marketplace_backend:latest
    pull_policy: never
    container_name: marketplace_celery_specs
    command: celery -A celery_app worker --loglevel=info --pool=solo -Q specs -n specs_worker@%h
    volumes:
      - ./backend:/app
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SPECS_WORKER=1
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_xlsx_worker:
    image: marketplace_backend:latest
    pull_policy: never
    container_name: marketplace_celery_xlsx
    command: celery -A celery_app worker --loglevel=info --pool=solo --max-tasks-per-child=20 -Q xlsx_export -n xlsx_worker@%h
    volumes:
      - ./backend:/app
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: marketplace_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media:
  ozon_templates:
