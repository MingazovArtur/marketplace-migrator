services:
  db:
    image: postgres:15-alpine
    stop_grace_period: 60s
    container_name: marketplace_db
    environment:
      POSTGRES_USER: migrator_user
      POSTGRES_PASSWORD: migrator_password_2026
      POSTGRES_DB: marketplace_migrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      # Исправлено: проверяем того пользователя и БД, которых создали
      test: ["CMD-SHELL", "pg_isready -U migrator_user -d marketplace_migrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: marketplace_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    # Добавлено: проверка готовности Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: marketplace_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: marketplace_celery
    command: celery -A celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: marketplace_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Анонимный том, чтобы локальные node_modules не ломали контейнер
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: