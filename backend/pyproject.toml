[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
# Полный набор для локальной проверки (pre-commit / make lint-full):
# E: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
# (см. также backend/Makefile и docs/engineering.md — план постепенного ужесточения)
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"] # Длину строки контролирует Black

[tool.ruff.lint.isort]
known-first-party = ["core", "database", "routers", "services", "parsers", "models", "tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
