<!DOCTYPE html>
<html lang="ru">
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2>Здравствуйте, {{ username }}!</h2>
  <p>Спасибо за регистрацию в <strong>{{ service_name }}</strong>.</p>
  <p>Для подтверждения email перейдите по ссылке:</p>
  <p><a href="{{ verify_url }}" style="background: #4F46E5; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">Подтвердить email</a></p>
  <p style="color: #666; font-size: 12px; margin-top: 30px;">
    Ссылка действует 24 часа. Если вы не регистрировались — проигнорируйте письмо.
  </p>
</body>
</html>
