name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — линт + тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Гейт = критические правила (синтаксис, undefined names, сравнение с константой).
      # Полный набор правил (см. backend/pyproject.toml) — локально: make lint-full
      # (долг по стилю старого кода и план ужесточения — docs/engineering.md)
      - name: Ruff — критические правила (гейт)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Pytest
        run: python -m pytest

  frontend:
    name: Frontend — линт + сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Сборка (vite build)
        run: npm run build

  docker:
    name: Docker — сборка прод-образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod frontend
