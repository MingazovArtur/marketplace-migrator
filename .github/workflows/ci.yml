name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — линт + тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Матрица: 3.12 — минимальная версия разработки, 3.15 — рантайм
    # прод-образа backend/Dockerfile(.prod) (dependabot, Round 27)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Гейт = полный набор правил проекта (backend/pyproject.toml).
      # Стилевой долг закрыт в Round 21 (447 → 0), с Round 34 CI гоняет
      # полный набор — как локальные гейты (docs/engineering.md)
      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest

  migrations:
    name: Миграции — alembic upgrade head
    runs-on: ubuntu-latest
    # R-35: функциональный гейт миграций — цепочка обязана применяться
    # на ЧИСТОЙ базе без ошибок (duplicate column и т.п.). До этого
    # миграции в CI не проверялись вовсе.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: marketplace_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://migrator:migrator@localhost:5432/marketplace_migrator
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: alembic upgrade head (чистая БД)
        run: alembic upgrade head

  frontend:
    name: Frontend — линт + тесты + сборка (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    # Матрица: 22 — текущая LTS-граница тулчейна, 26 — рантайм
    # build-стейджа frontend/Dockerfile(.prod) (dependabot, Round 27)
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Round 7: юнит-тесты фронтенда (Vitest: хук debounce, чистые функции
      # api/client, интеграция useProducts с TanStack Query)
      - name: Тесты (Vitest)
        run: npm run test

      - name: Сборка (vite build)
        run: npm run build

  docker:
    name: Docker — сборка прод-образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile.prod backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod frontend
