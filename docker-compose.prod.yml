name: marketplace-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    networks: [internal]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: marketplace_backend_prod:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET}}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: "${CORS_ORIGINS}"
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
    volumes:
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    mem_limit: 1536m
    cpus: 1.5
    networks: [internal]

  celery:
    image: marketplace_backend_prod:latest
    pull_policy: never
    restart: unless-stopped
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      -Q default
      -n default_worker@%h
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET}}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
    volumes:
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 2048m
    memswap_limit: 2560m
    cpus: 1.5
    networks: [internal]

  celery_xlsx:
    image: marketplace_backend_prod:latest
    pull_policy: never
    restart: unless-stopped
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      --max-tasks-per-child=20
      -Q xlsx_export
      -n xlsx_worker@%h
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET}}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
    volumes:
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 1536m
    memswap_limit: 2048m
    cpus: 1.0
    networks: [internal]

  # Отдельный воркер для долгих загрузок спеков (Ozon — 30+ минут):
  # раньше они стояли в общей очереди и миграции «зависали на 0%».
  # SPECS_WORKER=1 — на старте этого контейнера реестр мониторинга помечает
  # записи убитых перезапуском задач как «прервана» (можно продолжить).
  celery_specs:
    image: marketplace_backend_prod:latest
    pull_policy: never
    restart: unless-stopped
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=1
      --prefetch-multiplier=1
      -Q specs
      -n specs_worker@%h
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY:-${JWT_SECRET}}
      OZON_CLIENT_ID: ${OZON_CLIENT_ID:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-${REDIS_URL}}
      SPECS_WORKER: "1"
    volumes:
      - media:/app/media
      - ozon_templates:/app/templates/ozon
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 2048m
    memswap_limit: 2560m
    cpus: 1.5
    networks: [internal]

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
      - webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    networks: [internal, edge]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  media:
  certs:
  webroot:
  ozon_templates:

networks:
  internal:
  edge:
